# Terminates the browser's plain HTTP and tells Outline the request was secure.
#
# Outline in production marks its OAuth CSRF cookie `Secure` unconditionally
# (`secure: env.isProduction` in server/utils/passport.js) and koa then refuses
# to set a secure cookie on an unencrypted connection, so signing in over plain
# HTTP fails with a 500 before it ever reaches the identity provider.
#
# Outline trusts X-Forwarded-Proto when PROXY_HEADERS_TRUSTED is on, which is the
# default, so asserting it here is enough. Chrome accepts Secure cookies from
# http://localhost, which is what makes the round trip work without real TLS.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 3300;

    # Document uploads and imports.
    client_max_body_size 32m;

    location / {
        proxy_pass http://outline:3000;

        # All of these belong in this block: a proxy_set_header anywhere inside
        # a location replaces every one inherited from the server, rather than
        # adding to them, so splitting them across the two levels silently drops
        # the outer set.
        #
        # Outline builds absolute URLs from its own URL setting, but the host
        # header still has to carry the port the browser used.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        # The editor holds a websocket open.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }
}
